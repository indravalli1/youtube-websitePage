<!DOCTYPE html>
<html>
    <head>
        <title>
            Position Practice
        </title>
    </head>
    <body style="height:3000px;
    padding-top:60px;
    padding-left:72px;">
        <div style="background-color:black;
        color:white;
        position:fixed;
        top:0px;
        left:0px;
        right:0px;
        height:50px;
        z-index:1;
       ">
            header
        </div>
        <div style="background-color:green;
        color:white;
        position:fixed;
        left:0;
        bottom:0;
        top:50px;
        width:72px;">
            sidebar
            <div style="background-color:red;
            color:white;
            position:absolute;
            /* left:10px; */
            top:0px;
            right:0px;
            z-index:2;">
                X
            </div>
        </div>
        <div style="background-color:red;
        color:white;
        position:absolute;
        /* left:10px; */
        top:60px;
        right:10px;
        z-index:2;">
            absolute
        </div>
        <div style="background-color:lightblue;
        /*margin-top:60px;*/
        height:200px;
        width:200px;
        position:static;
        ">
            div 1
        </div>
        <div style="background-color:lightpink;
        height:200px;
        width:200px;
        position:relative;">
            div 2
            <div style="background-color:black;
                color:white;
                position:absolute;
                bottom:10px;
                right:10px;
                z-index:2;">
                    5:00
                </div>
            </div>
    </body>
</html>
<!-- z-index is based on priority .if high value of z-index occur it overrides lower z-index -->
